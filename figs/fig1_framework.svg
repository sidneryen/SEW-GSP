<?xml version="1.0" standalone="no"?><!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd"><svg id="SvgjsSvg1089" width="1317.5" height="543.2500095367432" xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:svgjs="http://svgjs.com/svgjs"><defs id="SvgjsDefs1090"><pattern patternUnits="userSpaceOnUse" id="pattern_mark_0" width="300" height="300"><text x="150" y="100" fill="rgba(229,229,229,0.8)" font-size="18" transform="rotate(-45, 150, 150)" style="dominant-baseline: middle; text-anchor: middle;"></text></pattern><pattern patternUnits="userSpaceOnUse" id="pattern_mark_1" width="300" height="300"><text x="150" y="200" fill="rgba(229,229,229,0.8)" font-size="18" transform="rotate(-45, 150, 150)" style="dominant-baseline: middle; text-anchor: middle;"></text></pattern><marker id="SvgjsMarker1151" markerWidth="13" markerHeight="9" refX="9.5" refY="4.5" viewBox="0 0 13 9" orient="auto" markerUnits="userSpaceOnUse" stroke-dasharray="0,0"><path id="SvgjsPath1152" d="M0,0 L13,4.5 L0,9 L0,0" fill="#323232" stroke="#323232" stroke-width="1"></path></marker><marker id="SvgjsMarker1155" markerWidth="13" markerHeight="9" refX="9.5" refY="4.5" viewBox="0 0 13 9" orient="auto" markerUnits="userSpaceOnUse" stroke-dasharray="0,0"><path id="SvgjsPath1156" d="M0,0 L13,4.5 L0,9 L0,0" fill="#323232" stroke="#323232" stroke-width="1"></path></marker><marker id="SvgjsMarker1159" markerWidth="13" markerHeight="9" refX="9.5" refY="4.5" viewBox="0 0 13 9" orient="auto" markerUnits="userSpaceOnUse" stroke-dasharray="0,0"><path id="SvgjsPath1160" d="M0,0 L13,4.5 L0,9 L0,0" fill="#323232" stroke="#323232" stroke-width="1"></path></marker><marker id="SvgjsMarker1163" markerWidth="13" markerHeight="9" refX="9.5" refY="4.5" viewBox="0 0 13 9" orient="auto" markerUnits="userSpaceOnUse" stroke-dasharray="0,0"><path id="SvgjsPath1164" d="M0,0 L13,4.5 L0,9 L0,0" fill="#323232" stroke="#323232" stroke-width="1"></path></marker><marker id="SvgjsMarker1167" markerWidth="13" markerHeight="9" refX="9.5" refY="4.5" viewBox="0 0 13 9" orient="auto" markerUnits="userSpaceOnUse" stroke-dasharray="0,0"><path id="SvgjsPath1168" d="M0,0 L13,4.5 L0,9 L0,0" fill="#323232" stroke="#323232" stroke-width="1"></path></marker><marker id="SvgjsMarker1171" markerWidth="13" markerHeight="9" refX="9.5" refY="4.5" viewBox="0 0 13 9" orient="auto" markerUnits="userSpaceOnUse" stroke-dasharray="0,0"><path id="SvgjsPath1172" d="M0,0 L13,4.5 L0,9 L0,0" fill="#323232" stroke="#323232" stroke-width="1"></path></marker><pattern patternUnits="userSpaceOnUse" id="wpspattern_mark_0" width="300" height="300"><text x="150" y="100" fill="#0000004d" font-size="18" transform="rotate(-45, 150, 150)" style="dominant-baseline: middle; text-anchor: middle;"></text></pattern></defs><rect id="svgbackgroundid" width="1317.5" height="543.2500095367432" fill="rgb(255,255,255)"></rect><rect id="SvgjsRect1092" width="1317.5" height="543.2500095367432" fill="url(#pattern_mark_0)"></rect><rect id="SvgjsRect1093" width="1317.5" height="543.2500095367432" fill="url(#pattern_mark_1)"></rect><g id="SvgjsG1094" transform="translate(25,25)"><path id="SvgjsPath1095" d="M 0 0L 380 0L 380 167L 0 167Z" stroke="rgba(33,41,48,1)" stroke-width="1.5" fill-opacity="1" fill="#ffffff"></path><g id="SvgjsG1096"><text id="SvgjsText1097" font-family="&quot;Microsoft YaHei&quot;, 微软雅黑, Arial, &quot;Liberation Sans&quot;, Helvetica, sans-serif" text-anchor="middle" font-size="24px" width="360px" fill="#323232" font-weight="700" align="middle" lineHeight="125%" letterSpacing="normal" anchor="middle" family="&quot;Microsoft YaHei&quot;, 微软雅黑, Arial" size="24px" weight="700" font-style="" opacity="1" transform="rotate(0, 190, 83.5)"><tspan id="SvgjsTspan1098" x="190.00000476837158" y="47.90004119873047" style="" dominant-baseline="alphabetic">Input data X</tspan><tspan id="SvgjsTspan1099" x="190.00000524520874" y="107.90004119873046" style="font-weight: normal;" dominant-baseline="alphabetic">min-max normalization</tspan><tspan id="SvgjsTspan1100" x="190.00000190734863" y="137.90004119873046" style="font-weight: normal;" dominant-baseline="alphabetic">to [0,1]^D</tspan></text></g></g><g id="SvgjsG1101" transform="translate(465,25)"><path id="SvgjsPath1102" d="M 0 0L 387.5 0L 387.5 167L 0 167Z" stroke="rgba(33,41,48,1)" stroke-width="1.5" fill-opacity="1" fill="#ffffff"></path><g id="SvgjsG1103"><text id="SvgjsText1104" font-family="&quot;Microsoft YaHei&quot;, 微软雅黑, Arial, &quot;Liberation Sans&quot;, Helvetica, sans-serif" text-anchor="middle" font-size="24px" width="368px" fill="#323232" font-weight="700" align="middle" lineHeight="125%" letterSpacing="normal" anchor="middle" family="&quot;Microsoft YaHei&quot;, 微软雅黑, Arial" size="24px" weight="700" font-style="" opacity="1" transform="rotate(0, 194, 83.5)"><tspan id="SvgjsTspan1105" x="194.00000500679016" y="47.90004119873047" style="" dominant-baseline="alphabetic">Stage 1a: CNLR relevance</tspan><tspan id="SvgjsTspan1106" x="194.00000405311584" y="77.90004119873046" style="font-weight: normal;" dominant-baseline="alphabetic">leave-group-out kNN graph</tspan><tspan id="SvgjsTspan1107" x="193.99480056762695" y="107.90004119873046" style="font-weight: normal;" dominant-baseline="alphabetic">Laplacian scores vs.</tspan><tspan id="SvgjsTspan1108" x="194.00000596046448" y="137.90004119873046" style="font-weight: normal;" dominant-baseline="alphabetic">permutation null → r_m</tspan></text></g></g><g id="SvgjsG1109" transform="translate(912.5,25)"><path id="SvgjsPath1110" d="M 0 0L 380 0L 380 167L 0 167Z" stroke="rgba(33,41,48,1)" stroke-width="1.5" fill-opacity="1" fill="#ffffff"></path><g id="SvgjsG1111"><text id="SvgjsText1112" font-family="&quot;Microsoft YaHei&quot;, 微软雅黑, Arial, &quot;Liberation Sans&quot;, Helvetica, sans-serif" text-anchor="middle" font-size="24px" width="360px" fill="#323232" font-weight="700" align="middle" lineHeight="125%" letterSpacing="normal" anchor="middle" family="&quot;Microsoft YaHei&quot;, 微软雅黑, Arial" size="24px" weight="700" font-style="" opacity="1" transform="rotate(0, 190, 83.5)"><tspan id="SvgjsTspan1113" x="189.99479794502258" y="47.90004119873047" style="" dominant-baseline="alphabetic">Stage 1b: weighting</tspan><tspan id="SvgjsTspan1114" x="189.99479722976685" y="77.90004119873046" style="font-weight: normal;" dominant-baseline="alphabetic">w = (1−ρ)1 + ρ D r / sum(r)</tspan><tspan id="SvgjsTspan1115" x="189.99479794502258" y="107.90004119873046" style="font-weight: normal;" dominant-baseline="alphabetic">ρ = max r_m; alternate</tspan><tspan id="SvgjsTspan1117" x="189.99479794502258" y="137.90004119873046" style="font-weight: normal; " dominant-baseline="alphabetic">graph ↔ weights</tspan></text></g></g><g id="SvgjsG1120" transform="translate(912.5,271.25)"><path id="SvgjsPath1121" d="M 0 0L 380 0L 380 167L 0 167Z" stroke="rgba(33,41,48,1)" stroke-width="1.5" fill-opacity="1" fill="#ffffff"></path><g id="SvgjsG1122"><text id="SvgjsText1123" font-family="&quot;Microsoft YaHei&quot;, 微软雅黑, Arial, &quot;Liberation Sans&quot;, Helvetica, sans-serif" text-anchor="middle" font-size="24px" width="360px" fill="#323232" font-weight="700" align="middle" lineHeight="125%" letterSpacing="normal" anchor="middle" family="&quot;Microsoft YaHei&quot;, 微软雅黑, Arial" size="24px" weight="700" font-style="" opacity="1" transform="rotate(0, 190, 83.5)"><tspan id="SvgjsTspan1124" x="190.00000500679016" y="47.90004119873047" style="" dominant-baseline="alphabetic">Stage 2: geodesic K-NN</tspan><tspan id="SvgjsTspan1125" x="190.00000643730164" y="77.90004119873046" style="font-weight: 400;" dominant-baseline="alphabetic">weighted kNN graph +</tspan><tspan id="SvgjsTspan1126" x="190.00000309944153" y="107.90004119873046" style="font-weight: 400;" dominant-baseline="alphabetic">truncated Dijkstra</tspan><tspan id="SvgjsTspan1127" x="190.00000524520874" y="137.90004119873046" style="font-weight: 400;" dominant-baseline="alphabetic">(exact, O(NK) memory)</tspan></text></g></g><g id="SvgjsG1128" transform="translate(468.75,271.25)"><path id="SvgjsPath1129" d="M 0 0L 380 0L 380 167L 0 167Z" stroke="rgba(33,41,48,1)" stroke-width="1.5" fill-opacity="1" fill="#ffffff"></path><g id="SvgjsG1130"><text id="SvgjsText1131" font-family="&quot;Microsoft YaHei&quot;, 微软雅黑, Arial, &quot;Liberation Sans&quot;, Helvetica, sans-serif" text-anchor="middle" font-size="24px" width="360px" fill="#323232" font-weight="700" align="middle" lineHeight="125%" letterSpacing="normal" anchor="middle" family="&quot;Microsoft YaHei&quot;, 微软雅黑, Arial" size="24px" weight="700" font-style="" opacity="1" transform="rotate(0, 190, 83.5)"><tspan id="SvgjsTspan1132" x="189.9947965145111" y="47.90004119873047" style="" dominant-baseline="alphabetic">Stage 3: soft boundary move</tspan><tspan id="SvgjsTspan1133" x="189.99479460716248" y="77.90004119873046" style="font-weight: 400;" dominant-baseline="alphabetic">boundary score BS_i</tspan><tspan id="SvgjsTspan1134" x="189.9947965145111" y="107.90004119873046" style="font-weight: normal;" dominant-baseline="alphabetic">β_i = sigm(4u_i)</tspan><tspan id="SvgjsTspan1136" x="189.9947965145111" y="137.90004119873046" style="font-weight: 400;" dominant-baseline="alphabetic">z_i ← z_i + β_i T F_i</tspan></text></g></g><g id="SvgjsG1141" transform="translate(25,271.25)"><path id="SvgjsPath1142" d="M 0 0L 380 0L 380 167L 0 167Z" stroke="rgba(33,41,48,1)" stroke-width="1.5" fill-opacity="1" fill="#ffffff"></path><g id="SvgjsG1143"><text id="SvgjsText1144" font-family="&quot;Microsoft YaHei&quot;, 微软雅黑, Arial, &quot;Liberation Sans&quot;, Helvetica, sans-serif" text-anchor="middle" font-size="24px" width="360px" fill="#323232" font-weight="700" align="middle" lineHeight="125%" letterSpacing="normal" anchor="middle" family="&quot;Microsoft YaHei&quot;, 微软雅黑, Arial" size="24px" weight="700" font-style="" opacity="1" transform="rotate(0, 190, 83.5)"><tspan id="SvgjsTspan1145" x="189.99479293823242" y="47.90004119873047" style="" dominant-baseline="alphabetic">Output</tspan><tspan id="SvgjsTspan1146" x="189.99479508399963" y="77.90004119873046" style="font-weight: 400;" dominant-baseline="alphabetic">optimized data in the</tspan><tspan id="SvgjsTspan1147" x="189.9947967529297" y="107.90004119873046" style="font-weight: 400;" dominant-baseline="alphabetic">learned metric space →</tspan><tspan id="SvgjsTspan1148" x="190.0000057220459" y="137.90004119873046" style="font-weight: 400;" dominant-baseline="alphabetic">K-means / AGG / DPC</tspan></text></g></g><g id="SvgjsG1149"><path id="SvgjsPath1150" d="M405.75 108.5L461.54999999999995 108.5" stroke="#323232" stroke-width="1.5" fill="none" marker-end="url(#SvgjsMarker1151)"></path></g><g id="SvgjsG1153"><path id="SvgjsPath1154" d="M853.25 108.5L909.05 108.5" stroke="#323232" stroke-width="1.5" fill="none" marker-end="url(#SvgjsMarker1155)"></path></g><g id="SvgjsG1157"><path id="SvgjsPath1158" d="M1102.5 192.75L1102.5 267.8" stroke="#323232" stroke-width="1.5" fill="none" marker-end="url(#SvgjsMarker1159)"></path></g><g id="SvgjsG1161"><path id="SvgjsPath1162" d="M911.75 354.75L852.2 354.75" stroke="#323232" stroke-width="1.5" fill="none" marker-end="url(#SvgjsMarker1163)"></path></g><g id="SvgjsG1165"><path id="SvgjsPath1166" d="M468 354.75L408.45 354.75" stroke="#323232" stroke-width="1.5" fill="none" marker-end="url(#SvgjsMarker1167)"></path></g><g id="SvgjsG1169"><path id="SvgjsPath1170" d="M658.75 439L658.75 468.25L1102.5 468.25L1102.5 441.70000000000005" stroke="#323232" stroke-width="1.5" fill="none" marker-end="url(#SvgjsMarker1171)"></path></g><g id="SvgjsG1173" transform="translate(713.75,465.75000953674316)"><path id="SvgjsPath1174" d="M 0 0L 392.5 0L 392.5 52.5L 0 52.5Z" stroke="none" fill="none"></path><g id="SvgjsG1175"><text id="SvgjsText1176" font-family="&quot;Microsoft YaHei&quot;, 微软雅黑, Arial, &quot;Liberation Sans&quot;, Helvetica, sans-serif" text-anchor="middle" font-size="20px" width="393px" fill="#323232" font-weight="400" align="middle" lineHeight="125%" letterSpacing="normal" anchor="middle" family="&quot;Microsoft YaHei&quot;, 微软雅黑, Arial" size="20px" weight="400" font-style="" opacity="1" transform="rotate(0, 196.5, 26.25)"><tspan id="SvgjsTspan1177" x="196.4947967529297" y="33.75002136230469" style="" dominant-baseline="alphabetic">repeat Stages 2-3 for d iterations</tspan></text></g></g><g id="SvgjsG1178" transform="translate(546.375,562.9583568572998)"><path id="SvgjsPath1179" d="M 0 0L 100 0L 100 40L 0 40Z" stroke="none" fill="none"></path><g id="SvgjsG1180"><text id="SvgjsText1181" font-family="&quot;Microsoft YaHei&quot;, 微软雅黑, Arial, &quot;Liberation Sans&quot;, Helvetica, sans-serif" text-anchor="middle" font-size="13px" width="100px" fill="#323232" font-weight="400" align="middle" lineHeight="125%" letterSpacing="normal" anchor="middle" family="&quot;Microsoft YaHei&quot;, 微软雅黑, Arial" size="13px" weight="400" font-style="" opacity="1" transform="rotate(0, 50, 20)"></text></g></g><g id="SvgjsG1182"></g><rect id="SvgjsRect1183" width="1317.5" height="543.2500095367432" fill="url(#wpspattern_mark_0)"></rect></svg>